<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora</title>

    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0-beta.2/css/bootstrap.min.css" 
        integrity="sha384-PsH8R72JQ3SOdhVi3uxftmaW6Vc51MKb0q5P2rRUpPvrszuE4W1povHYgTpBfshb" crossorigin="anonymous">

    <style>
        .calculadora{
            margin-top: 40px;
            border: 1px solid #000;
            padding: 20px;
            background-color: #2e2e2e;
            border-radius: 10px;
            box-shadow: 1px 5px #000;
       }

       .botao{
        width: 60px;
        height: 50px;
        margin: 5px;
        box-shadow: 1px 1px #000;
       }

       .clear{
        width: 130px;
       }

       .enter{
        height: 110px;
       }

       .zero{
        width: 130px;
       }

       .resultado{
        text-align: right;
        font-size: 20px;
        margin-top: 10px;
        margin-bottom: 20px;
        border: 1px solid #000;
        box-shadow: 1px 1px #000;
       }
    </style>
</head>

<body>

    <div class="container">
        <div class="row">
            <div class="col d-flex justify-content-center">
                <div class="calculadora">
                    <input type="text" class="form-control resultado" id="resultado" placeholder="0" disabled="disabled">

                    <div class="row">
                        <button onclick="calcular('operacao', 'c')" type="button" class="btn btn-dark btn-lg clear font-weight-light botao">C</button>
                        <button onclick="calcular('operacao', '/')" type="button" class="btn btn-dark btn-lg font-weight-light botao">/</button>
                        <button onclick="calcular('operacao', '*')" type="button" class="btn btn-dark btn-lg font-weight-light botao">X</button>
                    </div>

                    <div class="row">
                        <button onclick="calcular('numero', 7)" type="button" class="btn btn-dark btn-lg font-weight-light botao">7</button>
                        <button onclick="calcular('numero', 8)" type="button" class="btn btn-dark btn-lg font-weight-light botao">8</button>
                        <button onclick="calcular('numero', 9)" type="button" class="btn btn-dark btn-lg font-weight-light botao">9</button>
                        <button onclick="calcular('operacao', '-')" type="button" class="btn btn-dark btn-lg font-weight-light botao">-</button>
                    </div>

                    <div class="row">
                        <button onclick="calcular('numero', 4)" type="button" class="btn btn-dark btn-lg font-weight-light botao">4</button>
                        <button onclick="calcular('numero', 5)" type="button" class="btn btn-dark btn-lg font-weight-light botao">5</button>
                        <button onclick="calcular('numero', 6)" type="button" class="btn btn-dark btn-lg font-weight-light botao">6</button>
                        <button onclick="calcular('operacao', '+')" type="button" class="btn btn-dark btn-lg font-weight-light botao">+</button>
                    </div>
                    
                    <div class="row">
                        <button onclick="calcular('numero', 1)" type="button" class="btn btn-dark btn-lg font-weight-light botao">1</button>
                        <button onclick="calcular('numero', 2)" type="button" class="btn btn-dark btn-lg font-weight-light botao">2</button>
                        <button onclick="calcular('numero', 3)" type="button" class="btn btn-dark btn-lg font-weight-light botao">3</button>
                        <button onclick="calcular('operacao', '=')" type="button" class="btn btn-dark btn-lg font-weight-light enter botao">=</button>
                    </div>

                    <div class="row" style="margin-top: -60px">
                        <button onclick="calcular('numero', 0)" type="button" class="btn btn-dark btn-lg font-weight-light zero botao">0</button>
                        <button onclick="calcular('operacao', '.')" type="button" class="btn btn-dark btn-lg font-weight-light botao">.</button>

                    </div>
                </div>
            </div>
        </div>
    </div>
    
</body>

<script>
    function calcular(tipo, valor){
        if(tipo === 'operacao'){
            if(valor === 'c'){
                document.getElementById('resultado').value = ''
            }

            if(valor === '+' || valor === '-' || valor === '*' || valor === '/' || valor === '.'){
                document.getElementById('resultado').value += valor;
            }

            if(valor === '='){
                let resultado = eval(document.getElementById('resultado').value);
                document.getElementById('resultado').value = resultado;
            }

        } else if(tipo === 'numero'){
                document.getElementById('resultado').value += valor;
        }
    }
</script>

</html>
